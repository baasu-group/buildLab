{% extends "apply/emails/base.html" %}
{% block content %}
<p style="margin:0 0 6px;color:#2f80ed;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;">New application</p>
<h1 style="margin:0 0 12px;color:#102a43;font-size:26px;line-height:1.2;">{{ app.name }}</h1>
<span style="display:inline-block;background:#f8c94a;color:#102a43;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;">{{ app.track }}</span>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:22px;border-top:1px solid #d9e2ec;">
  <tr>
    <td style="padding:12px 0;border-bottom:1px solid #eef2f6;color:#627d98;font-size:13px;width:90px;">Email</td>
    <td style="padding:12px 0;border-bottom:1px solid #eef2f6;font-size:14px;font-weight:600;"><a href="mailto:{{ app.email }}" style="color:#2f80ed;text-decoration:none;">{{ app.email }}</a></td>
  </tr>
  <tr>
    <td style="padding:12px 0;border-bottom:1px solid #eef2f6;color:#627d98;font-size:13px;">Phone</td>
    <td style="padding:12px 0;border-bottom:1px solid #eef2f6;color:#102a43;font-size:14px;font-weight:600;">{{ app.phone|default:"Not provided" }}</td>
  </tr>
  <tr>
    <td style="padding:12px 0;border-bottom:1px solid #eef2f6;color:#627d98;font-size:13px;">Received</td>
    <td style="padding:12px 0;border-bottom:1px solid #eef2f6;color:#102a43;font-size:14px;font-weight:600;">{{ received }}</td>
  </tr>
</table>

<p style="margin:22px 0 8px;color:#627d98;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;">Why they want to join</p>
<div style="background:#f5f8fb;border-left:4px solid #2f80ed;border-radius:8px;padding:16px 18px;color:#102a43;font-size:15px;line-height:1.65;">{{ app.message|linebreaksbr }}</div>

<p style="margin:26px 0 0;">
  <a href="mailto:{{ app.email }}" style="display:inline-block;background:#102a43;color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:999px;">Reply to applicant</a>
</p>
{% endblock %}
