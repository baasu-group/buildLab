{# Email apps ignore <style> tags and CSS files, so every style is written inline. #}
<div style="background:#f5f8fb;padding:24px 12px;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #d9e2ec;border-radius:16px;overflow:hidden;">
    <tr><td style="background:#102a43;padding:22px 28px;">
      <span style="display:inline-block;background:#f8c94a;color:#102a43;font-weight:800;font-size:13px;padding:7px 9px;border-radius:8px;">BL</span>
      <span style="color:#ffffff;font-weight:700;font-size:16px;margin-left:10px;">BuildLab Internship</span>
    </td></tr>
    <tr><td style="padding:28px;">
      {% block content %}{% endblock %}
    </td></tr>
    <tr><td style="padding:16px 28px;background:#f5f8fb;color:#627d98;font-size:12px;">Learn. Build. Collaborate. Ship.</td></tr>
  </table>
</div>
